display_name: Agentic Harness
short_description: 深聊对齐、Task Queue 长跑和规则同步优先的 Codex / Claude Code 项目 harness。
default_prompt: 使用 agentic-harness：初始化或新项目先按 bootstrap-phases 输出 7 阶段初始化报告；确认平台并安装/检查项目级 skills 后，再恢复规则、深聊对齐、按三场景选择 Graphify、OpenSpec、Spec-Kit、UI/UX、TASKS.md、task-runner 或多代理。用户要求记录共识时按上下文同步协议判断写入 AGENTS/CLAUDE、ACTIVE、TASKS、handoff 或 memory。/goal 只在显式要求时作为兼容层。
